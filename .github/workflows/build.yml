name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: blockreels-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifacts are zipped and need a GitHub login, which makes installing on a phone
      # painful. A release asset is a direct .apk link that just opens.
      - name: Publish APK to the dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev \
            --title "Latest debug build" \
            --prerelease \
            --notes "Debug APK, rebuilt on every push. Install on the phone and open the app."
          gh release upload dev app/build/outputs/apk/debug/app-debug.apk --clobber

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
